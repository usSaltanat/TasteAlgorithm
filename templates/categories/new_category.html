{% extends 'base.html' %}
{% block title %}Добавить Категорию{% endblock %}

{% block content %}

<div class="container">
    <div class="logout-container">
        <a class="logout-btn" href="/logout">Выйти</a>
    </div>

    <form action="/categories/create" method="post">
        <a class="btn" href="/categories">Назад</a>
        <h2>Создать категорию</h2>
        <div class="category_input_label">
            <div class="category_name_input">
                {{ form.category.label() }}
                {{ form.category(placeholder="Введите новую категорию") }}
            </div>
        </div>
        {{ form.submit(class="btn") }}
    </form>
    {% endblock %}
